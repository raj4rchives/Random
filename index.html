<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Physics Master Syllabus Tracker</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #0284c7;
            --accent-green: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            position: relative;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .candidate-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .candidate-box input {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            width: 220px;
        }

        .btn-download {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background-color: #0369a1;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.8rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            vertical-align: middle;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-main);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.7rem;
        }

        tr:nth-child(even) {
            background-color: #fcfcfc;
        }

        .chapter-col {
            text-align: left;
            font-weight: 500;
            padding-left: 8px;
            min-width: 180px;
        }

        .num-col {
            font-weight: bold;
            color: var(--text-muted);
            width: 35px;
        }

        .lec-input {
            width: 45px;
            text-align: center;
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.8rem;
        }

        /* Custom Checkbox */
        .track-box {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            margin: 0 auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            transition: all 0.1s;
        }

        .track-box.checked {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .track-box.checked::after {
            content: '✓';
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                border: none;
                box-shadow: none;
                padding: 0;
            }
            .btn-download {
                display: none;
            }
            .candidate-box input {
                border: none;
                border-bottom: 1px solid #000;
                border-radius: 0;
            }
            th {
                background-color: #eee !important;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>JEE Physics Master Syllabus Tracker</h1>
        <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Class 11 & 12 Offline Printable & Interactive Ledger</p>
    </header>

    <div class="top-controls">
        <div class="candidate-box">
            <label for="candidateName">Candidate Name:</label>
            <input type="text" id="candidateName" placeholder="Apna naam yahan likhein..." oninput="saveData()">
        </div>
        <button class="btn-download" onclick="window.print()">📥 Download / Print PDF</button>
    </div>

    <div class="table-container">
        <table id="trackerTable">
            <thead>
                <tr>
                    <th rowspan="2">#</th>
                    <th rowspan="2">Chapter Name</th>
                    <th rowspan="2">Total Lec</th>
                    <th rowspan="2">Lec Comp</th>
                    <th rowspan="2">Revision Rounds</th>
                    <th rowspan="2">Mains Level</th>
                    <th rowspan="2">Adv Level</th>
                    <th rowspan="2">Short Notes</th>
                    <th colspan="5">Practice & Testing</th>
                    <th colspan="3">Revisions</th>
                </tr>
                <tr>
                    <th>DPP</th>
                    <th>HW</th>
                    <th>Module</th>
                    <th>PYQ</th>
                    <th>Test</th>
                    <th>R1</th>
                    <th>R2</th>
                    <th>R3</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Javascript will generate rows here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const chapters = [
        "Basic Maths", "Motion in Straight Line", "Motion in Plane", 
        "Newton's Laws of Motion", "Circular Motion", "Work, Energy & Power", 
        "Centre of Mass", "Rotational Motion", "Mechanical Properties of Solids", 
        "Mechanical Properties of Fluids", "Thermal Properties of Matter", 
        "KTG & Thermodynamics", "Simple Harmonic Motion", "Waves", 
        "Electric Charges & Field", "Electrostatic Potential & Capacitance", 
        "Current Electricity", "Moving Charges & Magnetism", "Electromagnetic Induction", 
        "Gravitation", "Alternating Current", "Ray Optics", "Electromagnetic Waves", 
        "Wave Optics", "Modern Physics", "Units & Measurements", "Semiconductors"
    ];

    const defaultLectures = [7, 8, 7, 11, 5, 6, 11, 15, 1, 7, 5, 6, 5, 8, 9, 8, 7, 7, 6, 5, 4, 10, 2, 5, 10, 2, 5];

    function buildTable() {
        const tbody = document.getElementById('tableBody');
        let html = '';
        chapters.forEach((chap, index) => {
            html += `
                <tr>
                    <td class="num-col">${index + 1}</td>
                    <td class="chapter-col">${chap}</td>
                    <td><input type="number" class="lec-input" id="total_${index}" value="${defaultLectures[index]}" oninput="saveData()"></td>
                    <td><input type="number" class="lec-input" id="comp_${index}" value="0" oninput="saveData()"></td>
                    <td><input type="text" class="lec-input" style="width:55px;" id="rev_${index}" value="" oninput="saveData()"></td>
                    <td><div class="track-box" id="mains_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="adv_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="notes_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="dpp_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="hw_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="mod_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="pyq_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="test_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="r1_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="r2_${index}" onclick="toggleBox(this)"></div></td>
                    <td><div class="track-box" id="r3_${index}" onclick="toggleBox(this)"></div></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
        loadData();
    }

    function toggleBox(el) {
        el.classList.toggle('checked');
        saveData();
    }

    function saveData() {
        const data = {
            candidateName: document.getElementById('candidateName').value,
            fields: {}
        };

        chapters.forEach((_, index) => {
            data.fields[`total_${index}`] = document.getElementById(`total_${index}`).value;
            data.fields[`comp_${index}`] = document.getElementById(`comp_${index}`).value;
            data.fields[`rev_${index}`] = document.getElementById(`rev_${index}`).value;

            ['mains', 'adv', 'notes', 'dpp', 'hw', 'mod', 'pyq', 'test', 'r1', 'r2', 'r3'].forEach(type => {
                const box = document.getElementById(`${type}_${index}`);
                data.fields[`${type}_${index}`] = box.classList.contains('checked');
            });
        });

        localStorage.setItem('jee_physics_tracker_data', JSON.stringify(data));
    }

    function loadData() {
        const saved = localStorage.getItem('jee_physics_tracker_data');
        if (!saved) return;
        const data = JSON.parse(saved);

        if (data.candidateName) {
            document.getElementById('candidateName').value = data.candidateName;
        }

        chapters.forEach((_, index) => {
            if (data.fields[`total_${index}`] !== undefined) {
                document.getElementById(`total_${index}`).value = data.fields[`total_${index}`];
            }
            if (data.fields[`comp_${index}`] !== undefined) {
                document.getElementById(`comp_${index}`).value = data.fields[`comp_${index}`];
            }
            if (data.fields[`rev_${index}`] !== undefined) {
                document.getElementById(`rev_${index}`).value = data.fields[`rev_${index}`];
            }

            ['mains', 'adv', 'notes', 'dpp', 'hw', 'mod', 'pyq', 'test', 'r1', 'r2', 'r3'].forEach(type => {
                if (data.fields[`${type}_${index}`]) {
                    document.getElementById(`${type}_${index}`).classList.add('checked');
                }
            });
        });
    }

    window.onload = buildTable;
</script>

</body>
</html>
