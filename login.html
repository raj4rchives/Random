<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartyweb — Login</title><link rel="stylesheet" href="style.css"></head><body>
<main class="login-page"><section class="login-card">
<div class="heading"><span class="eyebrow"></span><h1>Welcome back</h1><p></p></div>
<form id="loginForm"><div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@example.com" required></div>
<div class="field"><div class="label-row"><label>Password</label><button type="button" class="forgot" id="forgot">Forgot password?</button></div><div class="password"><input id="password" type="password" placeholder="Enter your password" required><button type="button" id="toggle">Show</button></div></div>
<label class="remember"><input id="remember" type="checkbox"> Remember me</label><button class="login" type="submit">Login</button></form>
<div class="divider"><span>or</span></div><button class="demo" id="demo">Continue with Google account</button>
<p class="signup">Don't have an account? <button id="signup">Create account</button></p><p class="secure">CartyWeb</p>
</section></main><div class="toast" id="toast"></div><script src="login.js"></script></body></html>
